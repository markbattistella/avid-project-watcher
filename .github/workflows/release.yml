name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version. If a draft with this tag exists, its notes are kept."
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA to release when no matching draft exists."
        required: false
        default: "main"
        type: string
  push:
    tags:
      # Deliberately loose: catches unpadded tags (2026.8.19) so they can be
      # normalised rather than silently ignored. Strict validation happens in
      # the prepare job.
      - "20[0-9][0-9].[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name || github.run_id }}
  cancel-in-progress: false

# ── Prepare ────────────────────────────────────────────────────────────────────
# Resolves version, validates format, and finds or creates the draft release.
# Supports two paths:
#   1. workflow_dispatch - use supplied version; reuse existing draft if found.
#   2. push tag - publish directly from the tag (YYYY.MM.DD[.N]).
#
# Versions are normalised to zero-padded YYYY.MM.DD[.N]. A tag pushed unpadded
# (2026.8.19) is released as 2026.08.19 and the unpadded tag is deleted, so tag
# ordering stays correct - "2026.8.19" sorts after "2026.08.24" in git.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version:        ${{ steps.release.outputs.version }}
      ref:            ${{ steps.release.outputs.ref }}
      release_id:     ${{ steps.release.outputs.release_id }}
      from_draft:     ${{ steps.release.outputs.from_draft }}
      source_tag:     ${{ steps.release.outputs.source_tag }}
    steps:
      - name: Resolve release
        id: release
        uses: actions/github-script@v7
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_REF:     ${{ github.event.inputs.ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            function setOutputs({ shouldRelease, version = '', ref = '', releaseId = '', fromDraft = false, sourceTag = '' }) {
              core.setOutput('should_release', shouldRelease ? 'true' : 'false');
              core.setOutput('version',        version);
              core.setOutput('ref',            ref);
              core.setOutput('release_id',     releaseId ? String(releaseId) : '');
              core.setOutput('from_draft',     fromDraft ? 'true' : 'false');
              core.setOutput('source_tag',     sourceTag);
            }

            // Validates and zero-pads to canonical YYYY.MM.DD[.N].
            // Accepts 2026.8.19 or 2026.08.19; both normalise to 2026.08.19.
            function normalizeVersion(raw) {
              const v = String(raw ?? '').trim();
              const m = /^(20\d{2})\.(\d{1,2})\.(\d{1,2})(?:\.(\d+))?$/.exec(v);
              if (!m) {
                throw new Error(`Version must be YYYY.M.D or YYYY.M.D.N - got: ${v}`);
              }
              const [, y, mo, d, patch] = m;
              const year = Number(y), month = Number(mo), day = Number(d);
              const date = new Date(Date.UTC(year, month - 1, day));
              if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) {
                throw new Error(`Version is not a valid calendar date: ${v}`);
              }
              if (patch !== undefined && Number(patch) === 0) {
                throw new Error('Same-day release suffix must be greater than zero.');
              }
              const pad = (n) => String(n).padStart(2, '0');
              const base = `${year}.${pad(month)}.${pad(day)}`;
              return patch === undefined ? base : `${base}.${Number(patch)}`;
            }

            async function allReleases() {
              return github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            }

            // Resolves a tag to the commit SHA it points at, unwrapping
            // annotated tags. The canonical tag may not exist yet, so the
            // build and the new release must both anchor to a real commit.
            async function tagCommitSha(tag) {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.object.type !== 'tag') return ref.object.sha;
              const { data: obj } = await github.rest.git.getTag({ owner, repo, tag_sha: ref.object.sha });
              return obj.object.sha;
            }

            // ── push tag ─────────────────────────────────────────────────────
            if (context.eventName === 'push') {
              const sourceTag = context.ref.replace('refs/tags/', '');
              const version   = normalizeVersion(sourceTag);

              if (sourceTag !== version) {
                core.warning(`Tag ${sourceTag} is not zero-padded; releasing as ${version} and removing ${sourceTag}.`);
              }

              setOutputs({ shouldRelease: true, version, ref: await tagCommitSha(sourceTag),
                fromDraft: false, sourceTag });
              return;
            }

            // ── workflow_dispatch ─────────────────────────────────────────────
            const version = normalizeVersion(process.env.INPUT_VERSION);

            const draft = (await allReleases()).find(r => {
              if (!r.draft) return false;
              try { return normalizeVersion(r.tag_name) === version; } catch { return false; }
            });

            if (draft) {
              // A draft's tag does not exist in git yet, so renaming it to the
              // canonical form is free - and required, or the publish job would
              // attach assets to a second release instead of this draft.
              if (draft.tag_name !== version) {
                core.notice(`Renaming draft tag ${draft.tag_name} to ${version}.`);
                await github.rest.repos.updateRelease({
                  owner, repo, release_id: draft.id, tag_name: version,
                });
              }
              setOutputs({ shouldRelease: true, version, ref: draft.target_commitish || defaultBranch,
                releaseId: draft.id, fromDraft: true });
              return;
            }

            setOutputs({ shouldRelease: true, version, ref: process.env.INPUT_REF || defaultBranch, fromDraft: false });

# ── Build ──────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label:          Windows x64
            runner:          windows-latest
            rid:             win-x64
            setup_artifact:  AvidProjectWatcher-Setup-win-x64.exe

          - label:   macOS arm64
            runner:  macos-latest
            rid:     osx-arm64
            admin_artifact:  AvidProjectWatcher-Admin-osx-arm64.dmg
            daemon_artifact: AvidProjectWatcher-Daemon-osx-arm64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── Generate icon.ico (Windows only) ─────────────────────────────────
      # Embeds a proper ICO into the exe so pinned taskbar shortcuts keep the icon.
      # ImageMagick is pre-installed on Windows runners.
      - name: Generate icon.ico
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          magick src/AvidProjectWatcher.Admin/Assets/icon.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            src/AvidProjectWatcher.Admin/Assets/icon.ico

      # ── Publish Admin UI ──────────────────────────────────────────────────
      - name: Publish Admin UI
        run: |
          dotnet publish src/AvidProjectWatcher.Admin/AvidProjectWatcher.Admin.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o ./out/admin/${{ matrix.rid }}

      # ── Publish Daemon ────────────────────────────────────────────────────
      - name: Publish Daemon
        run: |
          dotnet publish src/AvidProjectWatcher.Daemon/AvidProjectWatcher.Daemon.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o ./out/daemon/${{ matrix.rid }}

      # ── Windows: Inno Setup installer with component selection ──────────────
      # Uses PowerShell to avoid MSYS2 argument mangling when calling ISCC.exe.
      # /O sets the output dir to dist/ in the project root (OutputDir in the
      # .iss file is relative to the script directory, which would be wrong).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          $root = (Get-Location).Path
          & $iscc `
            "/DVersion=${{ needs.prepare.outputs.version }}" `
            "/DAdminDir=$root\out\admin\${{ matrix.rid }}" `
            "/DDaemonDir=$root\out\daemon\${{ matrix.rid }}" `
            "/O$root\dist" `
            "scripts\windows-installer.iss"

      # ── macOS: .app bundle + DMG for Admin, zip for Daemon ───────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          mkdir -p dist

          BINARY="AvidProjectWatcher.Admin"
          BUNDLE="Avid Project Watcher.app"

          mkdir -p "${BUNDLE}/Contents/MacOS"
          mkdir -p "${BUNDLE}/Contents/Resources"

          cp "./out/admin/${{ matrix.rid }}/${BINARY}" "${BUNDLE}/Contents/MacOS/${BINARY}"
          chmod +x "${BUNDLE}/Contents/MacOS/${BINARY}"

          # ── Info.plist ──────────────────────────────────────────────────
          cat > "${BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>Avid Project Watcher</string>
            <key>CFBundleDisplayName</key>       <string>Avid Project Watcher</string>
            <key>CFBundleIdentifier</key>        <string>com.markbattistella.avidprojectwatcher</string>
            <key>CFBundleVersion</key>           <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key>        <string>${BINARY}</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSMinimumSystemVersion</key>    <string>11.0</string>
            <key>NSHumanReadableCopyright</key>  <string>Copyright © 2026 MB+MAB. All rights reserved.</string>
          </dict>
          </plist>
          PLIST

          # ── Icon (.icns from PNG) ────────────────────────────────────────
          ICON_SRC="src/AvidProjectWatcher.Admin/Assets/icon.png"
          if [ -f "$ICON_SRC" ]; then
            mkdir -p AppIcon.iconset
            for size in 16 32 64 128 256 512; do
              sips -z $size $size "$ICON_SRC" --out "AppIcon.iconset/icon_${size}x${size}.png" > /dev/null
            done
            sips -z 32  32  "$ICON_SRC" --out AppIcon.iconset/icon_16x16@2x.png  > /dev/null
            sips -z 64  64  "$ICON_SRC" --out AppIcon.iconset/icon_32x32@2x.png  > /dev/null
            sips -z 256 256 "$ICON_SRC" --out AppIcon.iconset/icon_128x128@2x.png > /dev/null
            sips -z 512 512 "$ICON_SRC" --out AppIcon.iconset/icon_256x256@2x.png > /dev/null
            sips -z 512 512 "$ICON_SRC" --out AppIcon.iconset/icon_512x512.png    > /dev/null
            iconutil -c icns AppIcon.iconset -o "${BUNDLE}/Contents/Resources/AppIcon.icns"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" "${BUNDLE}/Contents/Info.plist"
          fi

          # ── DMG ─────────────────────────────────────────────────────────
          hdiutil create \
            -volname "Avid Project Watcher" \
            -srcfolder "${BUNDLE}" \
            -ov -format UDZO \
            "dist/${{ matrix.admin_artifact }}"

          # ── Daemon zip ───────────────────────────────────────────────────
          cd ./out/daemon/${{ matrix.rid }}
          zip -r "../../../dist/${{ matrix.daemon_artifact }}" .
          cd -

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.setup_artifact }}
          path: dist/${{ matrix.setup_artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Admin artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.admin_artifact }}
          path: dist/${{ matrix.admin_artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Daemon artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.daemon_artifact }}
          path: dist/${{ matrix.daemon_artifact }}
          if-no-files-found: error
          retention-days: 14

# ── Publish ────────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach assets to existing draft
        if: needs.prepare.outputs.from_draft == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/**/*

      - name: Publish existing draft
        if: needs.prepare.outputs.from_draft == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });

      - name: Create and publish new release
        if: needs.prepare.outputs.from_draft != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ needs.prepare.outputs.version }}
          target_commitish:     ${{ needs.prepare.outputs.ref }}
          name:                 ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest:          true
          fail_on_unmatched_files: true
          files: release-assets/**/*

      # ── Remove the unpadded tag ────────────────────────────────────────────
      # Only runs when the pushed tag differed from its canonical form. The
      # canonical tag now exists on the same commit, so the sloppy one is
      # redundant and would sort incorrectly against future releases.
      - name: Remove unpadded source tag
        if: >-
          needs.prepare.outputs.source_tag != '' &&
          needs.prepare.outputs.source_tag != needs.prepare.outputs.version
        uses: actions/github-script@v7
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
          VERSION:    ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const sourceTag = process.env.SOURCE_TAG;
            const version   = process.env.VERSION;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${version}`,
              });
            } catch {
              core.warning(`Canonical tag ${version} not found; keeping ${sourceTag}.`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${sourceTag}`,
              });
              core.notice(`Removed unpadded tag ${sourceTag}; canonical tag is ${version}.`);
            } catch (error) {
              core.warning(`Could not delete tag ${sourceTag}: ${error.message}`);
            }
